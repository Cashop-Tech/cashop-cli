name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @cashop/core --filter cashop-cli typecheck

      - name: Test
        run: pnpm --filter @cashop/core --filter cashop-cli test

      - name: Build
        run: pnpm --filter @cashop/core --filter cashop-cli build

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          pkg_ver=$(node -p "require('./packages/cli-c/package.json').version")
          if [ "$pkg_ver" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::packages/cli-c/package.json version ($pkg_ver) does not match tag (${{ steps.ver.outputs.version }})"
            exit 1
          fi

      - name: Pack tarball
        working-directory: packages/cli-c
        run: |
          mkdir -p release
          # Tarball layout stays the same as pre-monorepo: dist/ + package.json + lockfile + docs.
          # @cashop/core is bundled into dist/entry.js by tsup (noExternal),
          # so we strip the workspace:* dep from the shipped package.json —
          # npm install after extraction must not see it.
          node -e '
            const pkg = JSON.parse(require("fs").readFileSync("package.json","utf8"));
            delete pkg.dependencies["@cashop/core"];
            require("fs").writeFileSync("package.json.release", JSON.stringify(pkg, null, 2) + "\n");
          '
          cp ../../pnpm-lock.yaml pnpm-lock.yaml
          tar -czf "release/cashop-cli-${{ steps.ver.outputs.version }}.tar.gz" \
              --transform 's|^package.json.release$|package.json|' \
              dist/ package.json.release pnpm-lock.yaml README.md CHANGELOG.md
          rm pnpm-lock.yaml package.json.release
          cd release
          sha256sum "cashop-cli-${{ steps.ver.outputs.version }}.tar.gz" \
              > "cashop-cli-${{ steps.ver.outputs.version }}.sha256"

      - name: Detect prerelease
        id: pre
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke-test the tarball
        working-directory: packages/cli-c
        run: |
          set -e
          mkdir smoke && cd smoke
          tar -xzf "../release/cashop-cli-${{ steps.ver.outputs.version }}.tar.gz"
          npm install --omit=dev --no-audit --no-fund --loglevel=error
          out=$(node dist/entry.js --version)
          case "$out" in
            *"${{ steps.ver.outputs.version }}"*) ;;
            *)
              echo "::error::tarball version mismatch (got '$out', expected '${{ steps.ver.outputs.version }}')"
              exit 1
              ;;
          esac

      - name: Build release notes
        working-directory: packages/cli-c
        run: |
          {
            ./scripts/extract-changelog.sh "${{ steps.ver.outputs.version }}"
            cat scripts/release-footer.md
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/cli-c/release/*
          body_path: packages/cli-c/release_notes.md
          prerelease: ${{ steps.pre.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true

      - name: Bump Homebrew formula
        if: steps.pre.outputs.prerelease == 'false'
        working-directory: packages/cli-c
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ./scripts/bump-homebrew-formula.sh "${{ steps.ver.outputs.version }}"
